{% extends "base.html" %}
{% block title %}Change password · Bookshelf{% endblock %}
{% block content %}
  <div class="auth">
    <div class="auth__card">
      <div class="auth__head">
        <h1 class="auth__title">Change password</h1>
        <p class="auth__subtitle">Enter your old password, then choose a new one.</p>
      </div>
      <form method="post" class="auth__form" novalidate>
        {% csrf_token %}
        {% include "registration/_fields.html" %}
        <button type="submit" class="btn btn--primary btn--lg auth__submit">Change password</button>
      </form>
    </div>
  </div>
{% endblock content %}
