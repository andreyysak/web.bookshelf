{% extends "base.html" %}
{% block title %}Check your email · Bookshelf{% endblock %}
{% block content %}
  <div class="auth">
    <div class="auth__card">
      <div class="auth__head">
        <h1 class="auth__title">Check your email</h1>
        <p class="auth__subtitle">If an account exists for that address, we have sent a link to reset your password.</p>
      </div>
      <a href="{% url "login" %}" class="btn btn--secondary btn--lg auth__submit">Back to log in</a>
    </div>
  </div>
{% endblock content %}
