{% extends "base.html" %}
{% block title %}Reset password · Bookshelf{% endblock %}
{% block content %}
  <div class="auth">
    <div class="auth__card">
      <div class="auth__head">
        <h1 class="auth__title">Reset password</h1>
        <p class="auth__subtitle">Enter your email and we will send you a reset link.</p>
      </div>
      <form method="post" class="auth__form" novalidate>
        {% csrf_token %}
        {% include "registration/_fields.html" %}
        <button type="submit" class="btn btn--primary btn--lg auth__submit">Send reset link</button>
      </form>
      <p class="auth__footer"><a href="{% url "login" %}">Back to log in</a></p>
    </div>
  </div>
{% endblock content %}
