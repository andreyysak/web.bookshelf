{% extends "base.html" %}
{% block title %}Password reset · Bookshelf{% endblock %}
{% block content %}
  <div class="auth">

      <div class="auth__head">
        <h1 class="auth__title">Password reset</h1>

      <a href="{% url "login" %}" class="btn btn--primary btn--lg auth__submit">Log in</a>
    </div>
  </div>
{% endblock content %}
