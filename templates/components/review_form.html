<form method="post" class="form form--card">
  <div class="form__field">
    <label for="rating" class="form__label">Rating</label>
    <select id="rating" name="rating" class="select">
      <option>5</option>
      <option>4</option>
      <option>3</option>
      <option>2</option>
      <option>1</option>
    </select>
  </div>
  <div class="form__field">
    <label for="text" class="form__label">Your review</label>
    <textarea id="text" name="text" class="textarea"></textarea>
  </div>
  <div class="form__actions">
    <button type="submit" class="btn btn--primary">Submit review</button>
  </div>
</form>
