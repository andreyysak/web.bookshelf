<form method="post" action="{% url "reviews:review-create" book.pk %}" class="form form--card">
  {% csrf_token %}
  {% for error in form.non_field_errors %}<div class="form__error">{{ error }}</div>{% endfor %}
  {% for field in form %}
    <div class="form__field">
      {{ field.label_tag }}
      {{ field }}
      {% for error in field.errors %}<div class="form__error">{{ error }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn--primary">Submit review</button>
</form>
