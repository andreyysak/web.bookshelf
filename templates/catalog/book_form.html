{% extends "base.html" %}
{% block title %}{{ title }}{% endblock title %}
{% block content %}
  <form method="post" novalidate>
    {% csrf_token %} {{ form.non_field_errors }} {% for field in form %}
    {{ field.label_tag }} {{ field }} {{ field.errors }} {% endfor %}
  <button type="submit">Save</button>
</form>
{% endblock content %}
