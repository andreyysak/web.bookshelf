{% extends "base.html" %}
{% block title %}Delete {{ object.title }} · Bookshelf{% endblock %}
{% block content %}
  <div class="page-head">
    <h1 class="page-head__title">Delete book</h1>
  </div>
  <form method="post" class="form form--card">
    {% csrf_token %}
    <p>
      Are you sure you want to delete <strong>{{ object.title }}</strong>? This cannot be undone.
    </p>
    <div class="form__actions">
      <button type="submit" class="btn btn--primary">Delete</button>
      <a href="{{ object.get_absolute_url }}" class="btn btn--secondary">Cancel</a>
    </div>
  </form>
{% endblock content %}
