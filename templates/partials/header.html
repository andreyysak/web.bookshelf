<header class="header">
  <div class="header__wrap">
    <div class="header__start">
      <a href="{% url "catalog:book-list" %}" class="header__logo">
        Book<span>shelf</span>
      </a>
      <nav class="header__links">
        <a href="{% url "catalog:book-list" %}"
           class="header__links-item {% if request.resolver_match.view_name == 'catalog:book-list' %}header__links-item--active{% endif %}">Books</a>
        <a href="{% url "catalog:author-stats" %}"
           class="header__links-item {% if request.resolver_match.view_name == 'catalog:author-stats' %}header__links-item--active{% endif %}">Stats</a>
      </nav>
    </div>
    <form method="get"
          action="{% url "catalog:book-search" %}"
          class="header__end">
      <input name="q"
             value="{{ request.GET.q }}"
             type="search"
             placeholder="Title, author or ISBN"
             class="header__input">
      <button type="submit" class="header__cta">Search</button>
    </form>
  </div>
</header>
