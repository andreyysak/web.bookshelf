<aside class="latest-books">
  <h2 class="latest-books__title">Latest books</h2>
  <ul class="latest-books__list">
    {% for book in books %}
      <li class="latest-books__item">
        <a href="{{ book.get_absolute_url }}" class="latest-books__link">{{ book.title }}</a>
        {% if book.author %}
          <small class="latest-books__author">{{ book.author.name }}</small>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</aside>
