<nav class="pagination">
  {% if page_obj.has_previous %}
    <a href="?page=1" class="pagination__link">« First</a>
    <a href="?page={{ page_obj.previous_page_number }}" class="pagination__link">‹ Previous</a>
  {% else %}
    <span class="pagination__link pagination__link--disabled">« First</span>
    <span class="pagination__link pagination__link--disabled">‹ Previous</span>
  {% endif %}

  <span class="pagination__current">
    Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
  </span>

  {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}" class="pagination__link">Next ›</a>
    <a href="?page={{ page_obj.paginator.num_pages }}" class="pagination__link">Last »</a>
  {% else %}
    <span class="pagination__link pagination__link--disabled">Next ›</span>
    <span class="pagination__link pagination__link--disabled">Last »</span>
  {% endif %}
</nav>
